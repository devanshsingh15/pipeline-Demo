trigger:
- main

pool:
  name: Default  # Your self-hosted Windows agent pool

variables:
  MAVEN_OPTS: "-Xmx1024m"
  LT_USERNAME: 'devanshsingh'        # Replace with your LambdaTest username
  LT_ACCESS_KEY: 'LT_kjmzzJCYu70kReE7lwE0w2MOXLWg2q72EMh68BOot6fYI1c'  # Replace with your key

steps:
# Step 1: Checkout repository
- checkout: self

# Step 2: Install JDK 21
- powershell: |
    Write-Host "Installing OpenJDK 21..."
    if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
        Write-Host "Chocolatey not found. Installing Chocolatey..."
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
    }
    if (-not (choco list --local-only | Select-String "openjdk21")) {
        choco install openjdk21 -y --no-progress
    } else {
        Write-Host "OpenJDK 21 is already installed."
    }
    $jdkPath = "C:\Program Files\OpenJDK\openjdk-21\bin"
    if (Test-Path $jdkPath) { $env:PATH += ";$jdkPath" }
    java -version
  displayName: 'Install JDK 21'

# Step 3: Cache Maven dependencies
- task: Cache@2
  inputs:
    key: 'maven | "$(Agent.OS)" | **/pom.xml'
    path: '$(USERPROFILE)\.m2\repository'
    restoreKeys: |
      maven | "$(Agent.OS)"

# Step 4: Install Chrome & ChromeDriver
- powershell: |
    Write-Host "Installing Chrome & ChromeDriver..."
    $chromePath = "${Env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
    if (-Not (Test-Path $chromePath)) { $chromePath = "${Env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }
    if (-Not (Test-Path $chromePath)) {
        Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile chrome_installer.exe
        Start-Process -FilePath chrome_installer.exe -ArgumentList "/silent", "/install" -Wait
        Remove-Item -Force chrome_installer.exe
    }

    # Corrected line for Chrome version
    $chromeVersion = ((& $chromePath --version) -split " ")[2]
    Write-Host "Detected Chrome version: $chromeVersion"
    $chromeMajorVersion = $chromeVersion.Split('.')[0]

    $chromedriverVersion = Invoke-RestMethod -Uri "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$chromeMajorVersion"
    Invoke-WebRequest -Uri "https://chromedriver.storage.googleapis.com/$chromedriverVersion/chromedriver_win32.zip" -OutFile "chromedriver.zip"
    Expand-Archive -Path "chromedriver.zip" -DestinationPath "$(Agent.ToolsDirectory)\chromedriver" -Force
    Remove-Item -Force "chromedriver.zip"
    $env:PATH += ";$(Agent.ToolsDirectory)\chromedriver"
    Write-Host "ChromeDriver installed and added to PATH."
  displayName: 'Install Chrome and ChromeDriver'


# Step 5: Build and run tests
- script: mvn clean test
  displayName: 'Build & Run Selenium Tests'

# Step 6: Publish LambdaTest results
- task: LambdatestResults@1
  inputs:
    ltUsername: '$(LT_USERNAME)'
    ltAccessKey: '$(LT_ACCESS_KEY)'
    isTunnelActivate: false           # No tunnel
    isAppAutomate: false
    isSmartUI: false
    connection: ''                     # Leave empty if no pre-defined connection
  displayName: 'Publish LambdaTest Results'
